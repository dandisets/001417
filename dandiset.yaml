description: 'Psycode dataset is an OpenScope project designed to investigate the
  effects of psilocybin on visual processing and behavior in the mouse visual cortex.
  The core experimental design follows a ‘pre-drug / post-drug’ structure, allowing
  for a within-subject comparison of neural activity and task performance. Initially,
  mice are trained on a visual change detection task, similar to the paradigm used
  in the Visual Behavior Optical Physiology and Visual Behavior Neuropixels projects.
  In this go/no-go task, mice are shown a continuous series of briefly presented natural
  images (presented for 250 ms), and they earn water rewards by correctly reporting
  when the identity of the image changes. Alongside this behavior, the experiment
  includes a battery of passive visual stimulation protocols to probe the functional
  properties of visual neurons.  The experimental timeline follows a structured sequence.
  Before psilocybin application, mice first undergo passive visual stimulation for
  receptive field (RF) mapping and a surround suppression paradigm, providing a baseline
  measurement of each neuron’s tuning properties. This is followed by the change detection
  task to end the pre-injection epoch. After psilocybin is administered, the same
  sequence of stimuli is presented in reverse: first the change detection task, followed
  by receptive field mapping and surround suppression. Finally, passive visual stimulation
  is repeated, now including an optotagging protocol at the end to identify cortical
  SST neurons. This symmetrical design—with both behavioral and passive protocols
  repeated before and after drug administration—enables a powerful within-subject
  analysis of how psilocybin modulates visual processing, from basic receptive field
  properties to complex task-dependent dynamics involving natural image perception.
  The dataset therefore offers a unique opportunity to link molecularly-specific cell
  types, natural image perception, and the state-dependent changes induced by a psychedelic
  compound. **Note: In this dandiset, session ecephys-752309-2025-02-12-13-53-52 had
  synchronization/alignment issues between stimulus and ecephys timing. Session ecephys_767926_2025-02-26_15-49-35
  is missing running data because of a problem ith the sensor during recording**'
